name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (package|release)'
        required: false
        type: string
      package_run_id:
        description: 'Package run id for release'
        required: false
        type: string

jobs:
  ci-skip-check:
    runs-on: lab
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - name: Check skip
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "should_skip=false" >> $GITHUB_OUTPUT; else echo "should_skip=false" >> $GITHUB_OUTPUT; fi

  lint:
    runs-on: lab
    needs: ci-skip-check
    if: needs.ci-skip-check.outputs.should_skip != 'true'
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Lint
        run: echo "lint"

  test:
    runs-on: lab
    needs: lint
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Test
        run: echo "test"

  package:
    runs-on: lab
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'package'
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.DUNGEONPAT }}" | docker login repo.kenshiro.lab.tana -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || echo "${{ secrets.GITEA_TOKEN }}" | docker login repo.kenshiro.lab.tana -u "${{ gitea.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE=repo.kenshiro.lab.tana/tanadelgigante/civil-servant
          TAG=$(cat version.ini | tr -d '[:space:]')
          docker build -t ${IMAGE}:${TAG} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest
          docker inspect ${IMAGE}:${TAG} --format '{{index .RepoDigests 0}}' > image-digest.txt
          sha256sum image-digest.txt > image-digest.sha256
      - name: Upload checksum
        uses: actions/upload-artifact@v3
        with:
          name: image-checksum
          path: |
            image-digest.txt
            image-digest.sha256

  testbed:
    runs-on: lab
    needs: package
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Testbed
        run: echo "testbed"

  release:
    runs-on: lab
    needs: testbed
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release'
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Release
        run: echo "release"

  notify:
    runs-on: lab
    needs: [lint,test,package,testbed,release]
    if: always()
    steps:
      - name: Notify
        run: echo "notify"
