name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (package|release)'
        required: false
        type: string
      package_run_id:
        description: 'Package run id for release'
        required: false
        type: string

jobs:
  ci-skip-check:
    runs-on: lab
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - name: Check skip
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "should_skip=false" >> $GITHUB_OUTPUT; else echo "should_skip=false" >> $GITHUB_OUTPUT; fi

  lint:
    runs-on: lab
    needs: ci-skip-check
    if: needs.ci-skip-check.outputs.should_skip != 'true'
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Lint
        run: echo "lint"

  test:
    runs-on: lab
    needs: lint
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Test
        run: echo "test"

  package:
    runs-on: lab
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'package'
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Detect container runtime
        id: runtime
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "cmd=docker" >> $GITHUB_OUTPUT
          elif command -v podman >/dev/null 2>&1; then
            echo "cmd=podman" >> $GITHUB_OUTPUT
          else
            echo "cmd=none" >> $GITHUB_OUTPUT
            echo "Nessun runtime trovato: serve docker o podman sul runner lab" >&2
            exit 1
          fi
      - name: Setup registry certs
        run: |
          CMD=${{ steps.runtime.outputs.cmd }}
          mkdir -p /etc/docker/certs.d/repo.kenshiro.lab.tana /etc/containers/certs.d/repo.kenshiro.lab.tana /root/.docker
          CA="${{ secrets.DUNGEONCA || secrets.REGISTRY_CA }}"
          if [ -n "$CA" ]; then
            echo "$CA" | base64 -d > /etc/docker/certs.d/repo.kenshiro.lab.tana/ca.crt 2>/dev/null
            if [ ! -s /etc/docker/certs.d/repo.kenshiro.lab.tana/ca.crt ]; then
              echo "$CA" > /etc/docker/certs.d/repo.kenshiro.lab.tana/ca.crt
            fi
            cp /etc/docker/certs.d/repo.kenshiro.lab.tana/ca.crt /etc/containers/certs.d/repo.kenshiro.lab.tana/ca.crt 2>/dev/null || true
            cp /etc/docker/certs.d/repo.kenshiro.lab.tana/ca.crt /root/.docker/ca.pem 2>/dev/null || true
            cp /etc/docker/certs.d/repo.kenshiro.lab.tana/ca.crt /usr/local/share/ca-certificates/repo.crt 2>/dev/null && update-ca-certificates 2>/dev/null || true
          fi
          # Configura docker come insecure
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json << 'EOF'
          {
            "insecure-registries": ["repo.kenshiro.lab.tana"]
          }
          EOF
          if [ "$CMD" = "docker" ]; then
            pkill -HUP dockerd 2>/dev/null || true
            sleep 2
          fi
          if [ "$CMD" = "podman" ]; then
            mkdir -p ~/.config/containers/registries.conf.d
            cat > ~/.config/containers/registries.conf.d/lab.conf << 'EOF'
          [[registry]]
          location = "repo.kenshiro.lab.tana"
          insecure = true
          EOF
          fi
      - name: Login to Gitea Container Registry
        run: |
          REG_USER="${{ secrets.REPO_USER }}"
          REG_TOKEN="${{ secrets.DUNGEONPAT }}"
          if [ -z "$REG_USER" ] || [ -z "$REG_TOKEN" ]; then
            echo "ERRORE: imposta REPO_USER e DUNGEONPAT in Settings > Actions > Secrets" >&2
            exit 1
          fi
          CMD=${{ steps.runtime.outputs.cmd }}
          echo "$REG_TOKEN" | $CMD login --tls-verify=false repo.kenshiro.lab.tana -u "$REG_USER" --password-stdin 2>/dev/null || echo "$REG_TOKEN" | $CMD login repo.kenshiro.lab.tana -u "$REG_USER" --password-stdin
      - name: Setup buildx
        run: |
          CMD=${{ steps.runtime.outputs.cmd }}
          if [ "$CMD" = "docker" ]; then
            rm -rf /root/.docker 2>/dev/null || true
            mkdir -p /root/.docker
            echo '{"auths":{}}' > /root/.docker/config.json
            docker run --privileged --rm tonistiigi/binfmt --install all || true
            docker buildx rm multiarch-builder 2>/dev/null || true
            docker buildx create --use --name multiarch-builder --driver docker-container --driver-opt network=host 2>/dev/null || docker buildx create --use --name multiarch-builder --driver-opt network=host 2>/dev/null || docker buildx use multiarch-builder 2>/dev/null || true
            docker buildx inspect --bootstrap 2>/dev/null || true
          fi
      - name: Build and push image
        run: |
          CMD=${{ steps.runtime.outputs.cmd }}
          IMAGE=repo.kenshiro.lab.tana/tanadelgigante/civil-servant
          TAG=$(cat version.ini | tr -d '[:space:]')
          export DOCKER_BUILDKIT=1
          export BUILDAH_FORMAT=docker
          export DOCKER_TLS_VERIFY=0
          export DOCKER_CONFIG=/root/.docker
          if [ "$CMD" = "docker" ] && docker buildx version >/dev/null 2>&1; then
            docker buildx build --builder multiarch-builder --network=host --platform linux/amd64,linux/arm64 -t ${IMAGE}:${TAG} -t ${IMAGE}:latest --push .
            docker buildx imagetools inspect ${IMAGE}:${TAG} 2>/dev/null | grep -oP 'Digest: \Ksha256:[a-f0-9]+' | head -1 > image-digest.txt || echo "${IMAGE}:${TAG}" > image-digest.txt
          else
            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              PLAT="linux/arm64"
            else
              PLAT="linux/amd64"
            fi
            $CMD build --network=host --tls-verify=false --platform=$PLAT -t ${IMAGE}:${TAG} -t ${IMAGE}:latest .
            $CMD push --tls-verify=false ${IMAGE}:${TAG}
            $CMD push --tls-verify=false ${IMAGE}:latest
            if [ "$CMD" = "docker" ]; then
              $CMD inspect ${IMAGE}:${TAG} --format '{{index .RepoDigests 0}}' > image-digest.txt 2>/dev/null || $CMD inspect ${IMAGE}:${TAG} --format '{{.RepoDigests}}' > image-digest.txt
            else
              $CMD inspect ${IMAGE}:${TAG} --format '{{.Digest}}' > image-digest.txt
            fi
          fi
          sha256sum image-digest.txt > image-digest.sha256
      - name: Upload checksum
        run: |
          mkdir -p /tmp/artifacts
          cp image-digest.txt image-digest.sha256 /tmp/artifacts/ 2>/dev/null || true
          tar -czf image-checksum.tar.gz image-digest.txt image-digest.sha256 2>/dev/null || true

  testbed:
    runs-on: lab
    needs: package
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Detect container runtime
        id: runtime
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "cmd=docker" >> $GITHUB_OUTPUT
          elif command -v podman >/dev/null 2>&1; then
            echo "cmd=podman" >> $GITHUB_OUTPUT
          else
            echo "cmd=none" >> $GITHUB_OUTPUT
            exit 1
          fi
      - name: Login to Gitea Container Registry
        run: |
          REG_USER="${{ secrets.REPO_USER }}"
          REG_TOKEN="${{ secrets.DUNGEONPAT }}"
          CMD=${{ steps.runtime.outputs.cmd }}
          echo "$REG_TOKEN" | $CMD login repo.kenshiro.lab.tana -u "$REG_USER" --password-stdin
      - name: Smoke test with docker-compose
        run: |
          CMD=${{ steps.runtime.outputs.cmd }}
          IMAGE=repo.kenshiro.lab.tana/tanadelgigante/civil-servant
          TAG=$(cat version.ini | tr -d '[:space:]')
          mkdir -p services/hello-world
          cat > services/hello-world/service-config.json << EOF
          {
            "schemaVersion": 2,
            "name": "hello-world",
            "version": "1.0.0",
            "description": "Hello World example plugin",
            "runtime": {
              "type": "python",
              "version": "3.11"
            },
            "route": {
              "prefix": "/hello-world",
              "stripPrefix": 1
            },
            "backend": {
              "host": "hello-world",
              "port": 9001,
              "portMode": "fixed"
            },
            "health": {
              "type": "process",
              "intervalSeconds": 10,
              "timeoutSeconds": 3,
              "startupTimeoutSeconds": 90
            },
            "setup": {
              "script": null
            },
            "start": {
              "command": "python3 -m http.server 9001 --bind 0.0.0.0"
            },
            "stop": {
              "timeoutSeconds": 20
            }
          }
          EOF
          cat > docker-compose.smoke.yml << COMPOSE
          services:
            civil-servant:
              image: ${IMAGE}:${TAG}
              ports:
                - "8187:8187"
              volumes:
                - ./services:/app/services:ro
                - ./config:/config:ro
              environment:
                - SPRING_CONFIG_LOCATION=/config/application.yml
                - DEBIAN_FRONTEND=noninteractive
                - DEBCONF_NONINTERACTIVE_SEEN=true
                - TERM=dumb
              depends_on:
                - hello-world
            hello-world:
              image: python:3.11-slim
              command: ["python3", "-m", "http.server", "9001", "--bind", "0.0.0.0"]
          COMPOSE
          $CMD compose -f docker-compose.smoke.yml up -d || $CMD-compose -f docker-compose.smoke.yml up -d
          sleep 90
          curl -f http://localhost:8187/test || (echo "gateway test failed" && $CMD compose -f docker-compose.smoke.yml logs civil-servant && exit 1)
          curl -f http://localhost:8187/hello-world/ || (echo "hello-world route failed" && $CMD compose -f docker-compose.smoke.yml logs civil-servant && $CMD compose -f docker-compose.smoke.yml logs hello-world && exit 1)
          $CMD compose -f docker-compose.smoke.yml down -v
      - name: Cleanup
        if: always()
        run: |
          CMD=${{ steps.runtime.outputs.cmd }}
          $CMD compose -f docker-compose.smoke.yml down -v 2>/dev/null || true
          $CMD rm -f $(docker ps -aq 2>/dev/null || podman ps -aq 2>/dev/null) 2>/dev/null || true

  release:
    runs-on: lab
    needs: testbed
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release'
    steps:
      - name: Checkout
        run: |
          git clone "${{ gitea.server_url || github.server_url }}/${{ gitea.repository || github.repository }}.git" .
          git checkout "${{ gitea.sha || github.sha }}" || git checkout -B main "${{ gitea.sha || github.sha }}"
      - name: Release
        run: echo "release"

  notify:
    runs-on: lab
    needs: [lint,test,package,testbed,release]
    if: always()
    steps:
      - name: Notify
        run: echo "notify"

